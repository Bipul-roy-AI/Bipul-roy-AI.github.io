- name: Pipe Culvert Mesh Tool
  repo: https://github.com/Bipul-roy-AI/Pipe-Culvert-Mesh-Tool
  docs: https://github.com/Bipul-roy-AI/Pipe-Culvert-Mesh-Tool#readme
  description: "Two ArcMap toolboxes that fill pipe and culvert inflow and outflow levels from mesh elevations. The newer Extract Elevation from Elements (1900 pipes) tool reads up to 10 mesh layers, each with its own elevation field, follows the trench from each pipe end to pick the inlet and outlet levels, makes a dated backup first and updates only Z_Inflow and Z_Outflow. The original Populate Pipe Z From Mesh tool uses one mesh and a configurable search distance."
  screenshots:
    - src: /images/projects/pipe-culvert-mesh-tool/extract-elevation-dialog.png
      caption: "Extract Elevation from Elements (1900 pipes): choose the pipes, then up to 10 mesh layers with their own elevation fields and the search distances"
    - src: /images/projects/pipe-culvert-mesh-tool/extract-elevation-run-log.png
      caption: "Run log: selected pipes are detected, a dated backup is created, then the source pipes are prepared (file paths hidden)"
    - src: /images/projects/pipe-culvert-mesh-tool/populate-pipe-z.png
      caption: "Populate Pipe Z From Mesh: fill inflow and outflow levels from one mesh layer"
