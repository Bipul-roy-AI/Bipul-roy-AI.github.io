- name: ShasthoPath — Bangladesh Healthcare Accessibility
  repo: https://github.com/Bipul-roy-AI/Health_care_accessibility
  website: https://bipul-roy-ai.github.io/Health_care_accessibility/
  docs: https://github.com/Bipul-roy-AI/Health_care_accessibility#readme
