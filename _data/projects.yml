# Open-source projects from the author's public GitHub repositories.
# Optional per project: screenshots (list of {src, caption}) shown as demo pictures.
- name: GEE LULC Research Engine
  repo: https://github.com/Bipul-roy-AI/gee-lulc-research-engine
  description: "Automated Google Earth Engine land-cover classification with Sentinel-2 and Landsat imagery, supervised classifiers, cross-validation and uncertainty outputs."
- name: Automated Land Surface Temperature (LST) Mapping
  repo: https://github.com/Bipul-roy-AI/Automated-Land-Surface-Temperature-LST-Mapping
  description: "Python toolkit for Landsat 8/9, MODIS, ASTER and ECOSTRESS LST mapping, atmospheric correction, cloud masking, batch processing, and experimental spatial downscaling and temperature-trend analysis."
  screenshots:
    - src: https://raw.githubusercontent.com/Bipul-roy-AI/Automated-Land-Surface-Temperature-LST-Mapping/main/screenshots/LST_LANDSAT_L2ST_LC08_L2SP_136045_20260119_02_T1_ST_B10.png
      caption: "Landsat 8 Level-2 LST map and temperature distribution for Chattogram, Bangladesh"
    - src: https://raw.githubusercontent.com/Bipul-roy-AI/Automated-Land-Surface-Temperature-LST-Mapping/main/screenshots/dhaka_district_lst_map_and_histogram.png
      caption: "Dhaka District Landsat Level-2 LST map and cloud-screened temperature distribution (11 February 2026)"
- name: Sentinel Data Toolbox for QGIS
  repo: https://github.com/Bipul-roy-AI/qgis-sentinel-toolbox
  description: "QGIS plugin for discovering, preprocessing, analysing and quality-checking Sentinel-1 SAR and Sentinel-2 imagery."
  screenshots:
    - src: /images/projects/qgis-sentinel-toolbox/search-download.png
      caption: "Search & Download: pick an AOI and date range, then fetch Sentinel-1 scenes"
    - src: /images/projects/qgis-sentinel-toolbox/preprocess.png
      caption: "Preprocess: dB conversion, Lee speckle filter and land/water mask"
    - src: /images/projects/qgis-sentinel-toolbox/quick-analysis.png
      caption: "Quick Analysis: oil spill detection with fixed threshold or CA-CFAR"
    - src: /images/projects/qgis-sentinel-toolbox/settings.png
      caption: "Settings: default folders and analysis thresholds"
- name: Watershed Rainfall Analyzer
  repo: https://github.com/Bipul-roy-AI/watershed-rainfall-analysis
  description: "Basin area-weighted rainfall zonal statistics, no-data safeguards and trend analysis for hydrological workflows."
- name: Bangladesh Water Balance & Recharge
  repo: https://github.com/Bipul-roy-AI/gee-water-balance-recharge-bangladesh
  description: "Satellite-based annual potential groundwater recharge screening model incorporating rainfall, ET, runoff and seasonal storage change."
- name: Topographic Soil Moisture Controls
  repo: https://github.com/Bipul-roy-AI/topographic-soil-moisture-controls
  description: "Methodological demonstration of terrain-based Random Forest models and spatial cross-validation with a synthetic—not observed—soil moisture proxy."
- name: Bangladesh Surface-Water Dynamics
  repo: https://github.com/Bipul-roy-AI/Bangladesh-surface-water-analysis
  description: "Monsoon-sensitive remote sensing for monitoring seasonal water extent and water-body transitions in the Bangladesh Delta."
- name: Dhaka Air Pollution Climate Health Intelligence
  repo: https://github.com/Bipul-roy-AI/Dhaka-Air-Pollution-Climate-Health-Intelligence
  description: "Environmental data-science framework integrating air-quality observations, satellite products and climate reanalysis time series."
- name: Pipe Culvert Mesh Tool
  repo: https://github.com/Bipul-roy-AI/Pipe-Culvert-Mesh-Tool
  description: "ArcMap toolbox that fills pipe and culvert inflow and outflow levels from mesh elevations, using pipe direction and a configurable search distance."
  screenshots:
    - src: /images/projects/pipe-culvert-mesh-tool/populate-pipe-z.png
      caption: "Populate pipe inflow and outflow levels from mesh polygons"
- name: DHI MIKE Model Crosscheck
  repo: https://github.com/Bipul-roy-AI/DHI_MIKE_m11-mu-m21fm-crosscheck
  description: "ArcMap toolbox that checks pipe and node shapefile values against MIKE 11, MIKE+ and MIKE 21 FM models, with separate CSV reports and M21FM batch processing."
  screenshots:
    - src: /images/projects/dhi-mike-crosscheck/m11-check.png
      caption: "MIKE 11: compare selected pipes with an NWK network"
    - src: /images/projects/dhi-mike-crosscheck/mu-check.png
      caption: "MIKE+: check pipe levels and node ground, invert and diameter values"
    - src: /images/projects/dhi-mike-crosscheck/m21fm-check.png
      caption: "MIKE 21 FM: compare pipe levels and culvert dimensions"
    - src: /images/projects/dhi-mike-crosscheck/m21fm-batch-check.png
      caption: "MIKE 21 FM batch: check selected pipes against multiple models"
