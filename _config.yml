name: "Bipul Roy"
title: "Computational Geographer"
institution: "GIS Analyst · Research Assistant · Graduate Researcher"
email: "bipulroyedu@gmail.com"
photo: "bipul-roy.jpg"
lang: en
links:
  google_scholar: ""
  github: "https://github.com/Bipul-roy-AI"
  researchgate: ""
  orcid: ""
  twitter: ""
  linkedin: "https://www.linkedin.com/in/bipul-roy-635140171/"
  cv: ""
accent_color: "#147c79"
dark_mode: true
math: false
description: "Bipul Roy — computational geography, hydrodynamic modelling, satellite remote sensing, GIS, and environmental data science."
url: ""
baseurl: ""
analytics:
  google_id: ""
  plausible_domain: ""
  umami_website_id: ""
  umami_src: ""
  goatcounter: ""
nav_pages:
  - name: about
  - name: experience
  - name: research
  - name: publications
  - name: software
  - name: contact
scholar:
  last_name: Roy
  first_name: ["Bipul", "B."]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"
  bibtex_skip_fields: [abstract, month_numeric, file, selected, code, slides, video, poster, data]
permalink: /blog/:year/:title/
include: [_pages]
sass:
  style: compressed
  quiet_deps: true
  silence_deprecations: [import]
  sourcemap: development
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true
plugins: ["jekyll/scholar", "jekyll-sitemap"]
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - .bundle
  - node_modules
  - previous-site.html
